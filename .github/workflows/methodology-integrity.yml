name: Release integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-integrity:
    name: release-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Prepare expected integrity evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/expected-integrity
          python tools/generate_manifest.py
          cp REPO_MANIFEST.json SHA256SUMS build/expected-integrity/
          git checkout -- REPO_MANIFEST.json SHA256SUMS
      - name: Upload expected integrity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: expected-integrity
          path: build/expected-integrity/
          if-no-files-found: error
          retention-days: 7
      - name: Validate source candidate
        env:
          VALIDATE_NETWORK: '1'
        run: bash scripts/validate.sh

  windows-validation:
    name: windows-validation
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Validate on Windows
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/validate.ps1
