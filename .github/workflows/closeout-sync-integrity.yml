name: Closeout sync integrity

on:
  push:
    branches:
      - hardening/venv-boundary-v0.2.4

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt
      - name: Regenerate exact checked-in integrity evidence
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/closeout-sync-integrity.yml
          python tools/generate_manifest.py
          python tools/generate_manifest.py --check
          git config user.name 'Bridge Node 7'
          git config user.email '291729790+Bridge-Node-7@users.noreply.github.com'
          git add -A
          git commit -m 'release: synchronize exact v0.2.4 integrity evidence'
          git push origin HEAD:hardening/venv-boundary-v0.2.4
