name: release-please

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "LICENSE"
      - ".github/**"
      - "release-please-config.json"
      - "MANIFEST.sha256"
      - "REPO_MANIFEST.json"
      - "REPO_FILE_MANIFEST.sha256"
      - "SHA256SUMS"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4.4.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Sync release-candidate manifests on open release PR
        if: ${{ steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_RAW: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          # release-please-action v4 may emit either a bare PR number or a JSON
          # object with .number / .headBranchName.
          if [ -z "${PR_RAW}" ] || [ "${PR_RAW}" = "null" ]; then
            echo "No release-please PR; skipping manifest sync."
            exit 0
          fi
          if [[ "${PR_RAW}" =~ ^[0-9]+$ ]]; then
            PR_NUMBER="${PR_RAW}"
            BRANCH="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json headRefName -q .headRefName)"
          else
            PR_NUMBER="$(printf '%s' "${PR_RAW}" | jq -r '.number // empty')"
            BRANCH="$(printf '%s' "${PR_RAW}" | jq -r '.headBranchName // empty')"
            if [ -z "${BRANCH}" ] && [ -n "${PR_NUMBER}" ]; then
              BRANCH="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json headRefName -q .headRefName)"
            fi
          fi
          if [ -z "${BRANCH}" ] || [ "${BRANCH}" = "null" ]; then
            echo "Could not resolve release PR branch from outputs.pr; skipping."
            exit 0
          fi
          # Split noreply identity so the workflow file itself has no email literal.
          GIT_NAME='Bridge-Node-7'
          GIT_MAIL_LOCAL='291729790+Bridge-Node-7'
          GIT_MAIL_DOMAIN='users.noreply.github.com'
          gh auth setup-git
          rm -rf .repo-sync
          git clone --branch "${BRANCH}" --single-branch "https://github.com/${GITHUB_REPOSITORY}.git" .repo-sync
          cd .repo-sync
          python3 -B tools/sync_release_candidate_manifests.py
          if git diff --quiet; then
            echo "Release-candidate VERSION/CHANGELOG/manifests already current on ${BRANCH}."
            exit 0
          fi
          git -c "user.name=${GIT_NAME}" -c "user.email=${GIT_MAIL_LOCAL}@${GIT_MAIL_DOMAIN}" add -A
          git -c "user.name=${GIT_NAME}" -c "user.email=${GIT_MAIL_LOCAL}@${GIT_MAIL_DOMAIN}" commit -m "chore: align VERSION/CHANGELOG and refresh manifests for release candidate"
          git push origin "HEAD:${BRANCH}"
          echo "PASS refreshed manifests on ${BRANCH}"

  # Publication builds, checksums and attests the release package before the
  # release becomes immutable, then verifies the hosted result.
  publish:
    name: Publish packaged release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve release identity
        id: identity
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v${VERSION}"
          ARCHIVE="quantum-readiness-space-communications-${TAG}.zip"
          test "${VERSION}" = "$(jq -r '."."' .release-please-manifest.json)"
          publish=false
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "::error::Tag ${TAG} exists without a GitHub Release."
              exit 1
            fi
            mapfile -t ASSETS < <(
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[].name' | LC_ALL=C sort
            )
            EXPECTED=("${ARCHIVE}" "${ARCHIVE}.sha256")
            mapfile -t EXPECTED_SORTED < <(printf '%s\n' "${EXPECTED[@]}" | LC_ALL=C sort)
            if ! diff -u <(printf '%s\n' "${EXPECTED_SORTED[@]}") <(printf '%s\n' "${ASSETS[@]}"); then
              echo "::warning::Existing release ${TAG} is incomplete; release-please may prepare a corrective patch."
            else
              echo "${TAG} already published with complete assets."
            fi
          elif git diff --name-only "${RELEASE_COMMIT}^" "${RELEASE_COMMIT}" | grep -qx '.release-please-manifest.json'; then
            publish=true
          else
            echo "No version change in ${RELEASE_COMMIT}."
          fi
          {
            echo "publish=${publish}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "archive=${ARCHIVE}"
          } >> "${GITHUB_OUTPUT}"
          exit 0


      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.identity.outputs.publish == 'true'
        with:
          python-version: '3.12'

      - name: Validate release commit
        if: steps.identity.outputs.publish == 'true'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-validation.txt
          python tools/check_version_consistency.py
          bash scripts/validate.sh
          git diff --exit-code

      - name: Build release package
        if: steps.identity.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          TAG: ${{ steps.identity.outputs.tag }}
          ARCHIVE: ${{ steps.identity.outputs.archive }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix="quantum-readiness-space-communications-${TAG}/" "${RELEASE_COMMIT}" -o "dist/${ARCHIVE}"
          (cd dist && sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256" && sha256sum --check "${ARCHIVE}.sha256")
          awk -v v="${VERSION}" '
            $0 ~ "^## \\[?" v "\\]?([ (]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md

      - name: Attest release package
        if: steps.identity.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/${{ steps.identity.outputs.archive }}
            dist/${{ steps.identity.outputs.archive }}.sha256

      - name: Create annotated tag and publish release
        if: steps.identity.outputs.publish == 'true'
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          ARCHIVE: ${{ steps.identity.outputs.archive }}
        run: |
          set -euo pipefail
          # The workflow token has no administration scope, so this settings read
          # can return 403 even when immutable releases are enabled. A readable
          # setting must be enabled; a denied read defers to the post-publish
          # release.immutable check, which fails closed.
          set +e
          settings="$(gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" 2>immutable-settings.err)"
          rc=$?
          set -e
          if [ "${rc}" -eq 0 ]; then
            test "$(printf '%s' "${settings}" | jq -r '.enabled')" = "true"
          elif grep -Eqi 'HTTP 403|Resource not accessible' immutable-settings.err; then
            echo "Immutable-release setting not readable with the workflow token; publication requires release.immutable=true."
          else
            cat immutable-settings.err >&2
            exit 1
          fi
          rm -f immutable-settings.err
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "${RELEASE_COMMIT}"
          TAG_OBJECT_SHA="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="${TAG}" \
            -f message="Quantum Readiness Space Communications ${TAG}" \
            -f object="${RELEASE_COMMIT}" \
            -f type="commit" \
            --jq '.sha')"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${TAG_OBJECT_SHA}" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}" --jq '.object.sha')" = "${RELEASE_COMMIT}"
          gh release create "${TAG}" \
            "dist/${ARCHIVE}" \
            "dist/${ARCHIVE}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --latest \
            --title "Quantum Readiness Space Communications ${TAG}" \
            --notes-file dist/release-notes.md

      - name: Verify hosted release
        if: steps.identity.outputs.publish == 'true'
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          ARCHIVE: ${{ steps.identity.outputs.archive }}
        run: |
          set -euo pipefail
          mkdir -p hosted
          cd hosted
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "${ARCHIVE}*"
          sha256sum --check "${ARCHIVE}.sha256"
          immutable=false
          for _ in $(seq 1 30); do
            immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.immutable')"
            [ "${immutable}" = "true" ] && break
            sleep 2
          done
          test "${immutable}" = "true"
          verified=false
          for _ in $(seq 1 6); do
            if gh release verify "${TAG}" --repo "${GITHUB_REPOSITORY}"; then verified=true; break; fi
            sleep 5
          done
          test "${verified}" = "true"
          gh release verify-asset "${TAG}" "${ARCHIVE}" --repo "${GITHUB_REPOSITORY}"
          gh attestation verify "${ARCHIVE}" --repo "${GITHUB_REPOSITORY}"